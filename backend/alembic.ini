[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# NOTE: this value is intentionally a placeholder. env.py overrides it at
# runtime with settings.sync_database_url (derived from DATABASE_URL), so the
# real connection string always comes from the environment, never this file.
sqlalchemy.url = postgresql+psycopg2://placeholder:placeholder@localhost/placeholder

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
